_format_version: "2.1"
_transform: true

# CORS global para que la PWA (nginx:8080) pueda llamar a la API (Kong:8000).
plugins:
  - name: cors
    config:
      origins:
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
        - X-Client-Info
        - apikey
      exposed_headers:
        - X-Total-Count
        - Content-Range
      credentials: true
      max_age: 3600

services:
  - name: auth
    url: http://auth:9999
    routes:
      - name: auth-v1
        paths:
          - /auth/v1
        strip_path: true
        preserve_host: false

  - name: rest
    url: http://rest:3000
    routes:
      - name: rest-v1
        paths:
          - /rest/v1
        strip_path: true
        preserve_host: false

  - name: storage
    url: http://storage:5000
    routes:
      - name: storage-v1
        paths:
          - /storage/v1
        strip_path: true
        preserve_host: false

# ============================================================
# Render Blueprint · Acta de Tecnología Levapan (Supabase Edition)
# Las credenciales NO van aquí: se definen en el panel de Render.
# ============================================================
services:
  - type: web
    name: acta-levapan-ti
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: CLOUD_MODE
        value: "true"
      # Secretos: se completan en el panel de Render (sync: false).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

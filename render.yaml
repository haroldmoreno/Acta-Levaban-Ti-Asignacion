# ============================================================
# Render Blueprint · Acta de Tecnología Levapan
# ------------------------------------------------------------
# Crea el servicio web con URL fija https://<nombre>.onrender.com
# Las credenciales NO van aquí: se definen en el panel de Render
# (Environment → Environment Variables) y quedan como secretos.
# ============================================================
services:
  - type: web
    name: acta-levapan-ti
    runtime: node
    plan: free
    region: virginia
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: CLOUD_MODE
        value: "true"
      - key: HOST
        value: 0.0.0.0
      - key: ACTA_CARPETA_BASE
        value: ""
      - key: SHAREPOINT_LIST_ID
        value: 6e37ce52-b4d2-49ce-a628-63c1d811a563
      # Ruta del sitio del inventario: permite reconstruir SITE_ID si la
      # variable se copia incompleta en el panel de Render.
      - key: SHAREPOINT_SITE_PATH
        value: /sites/Informatica_Tecnologia
      # Secretos: se completan en el panel de Render (sync: false).
      - key: TENANT_ID
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SITE_ID
        sync: false
      - key: HTTP_WEBHOOK_URL
        sync: false
